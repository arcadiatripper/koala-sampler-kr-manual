<aside class="guide-sidebar" aria-label="가이드 목차">
  <nav>
    {% for group in site.data.guide_nav %}
      <section class="sidebar-group">
        <h2>{{ group.label }}</h2>
        <ul>
          {% for item in group.items %}
            {% assign resolved_url = item.url | relative_url %}
            <li>
              <a href="{{ resolved_url }}" {% if page.url == item.url %}aria-current="page"{% endif %}>
                <span>{{ item.label }}</span>
                <strong>{{ item.title }}</strong>
              </a>
            </li>
          {% endfor %}
        </ul>
      </section>
    {% endfor %}
  </nav>
</aside>
