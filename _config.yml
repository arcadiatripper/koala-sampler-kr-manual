url: "https://arcadiatripper.github.io"
baseurl: "/koala-sampler-kr-manual"
lang: ko-KR
title: KOALA SAMPLER MANUAL - 비공식 한국어 번역 초안
author:
  name: Nikolai Sokolov
  layout: Alex Aleksandrov
  coding: Stas Pyshevski
  url: https://metawork.studio
  email: hello@metawork.studio

guide_creator:
  name: "레네 RENÉ"
  role: "한국어 번역·가이드 제작"
  youtube: "https://www.youtube.com/@arcadiatripper"
  instagram: "https://www.instagram.com/arcadiatripper/"
